```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login Administrativo</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937
        );

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


.login-box {

    width: 100%;

    max-width: 400px;

    background: white;

    padding: 35px;

    border-radius: 14px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.30);

}


.logo {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    margin-bottom: 8px;

}


.logo span {

    color: #22c55e;

}


.subtitulo {

    text-align: center;

    color: #6b7280;

    margin-bottom: 30px;

}


.campo {

    margin-bottom: 18px;

}


.campo label {

    display: block;

    margin-bottom: 7px;

    font-weight: bold;

    font-size: 14px;

}


.campo input {

    width: 100%;

    padding: 13px;

    border: 1px solid #d1d5db;

    border-radius: 7px;

    font-size: 15px;

    outline: none;

}


.campo input:focus {

    border-color: #22c55e;

}


.botao {

    width: 100%;

    border: none;

    padding: 13px;

    border-radius: 7px;

    background: #22c55e;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


.botao:hover {

    background: #16a34a;

}


.botao:disabled {

    opacity: .6;

    cursor: wait;

}


.mensagem {

    display: none;

    margin-bottom: 18px;

    padding: 12px;

    border-radius: 7px;

    font-size: 14px;

    text-align: center;

}


.mensagem.erro {

    display: block;

    background: #fee2e2;

    color: #991b1b;

}


.mensagem.sucesso {

    display: block;

    background: #dcfce7;

    color: #166534;

}


.carregando {

    text-align: center;

    margin-top: 15px;

    color: #6b7280;

    display: none;

}


</style>

</head>


<body>


<div class="login-box">


<div class="logo">

    PAINEL
    <span>ADMINISTRATIVO</span>

</div>


<div class="subtitulo">

    Entre com suas credenciais

</div>



<div
    id="mensagem"
    class="mensagem"
>
</div>



<form id="formLogin">


<div class="campo">

<label for="email">

    E-mail

</label>


<input
    type="email"
    id="email"
    placeholder="Digite seu e-mail"
    autocomplete="username"
    required
>

</div>



<div class="campo">

<label for="senha">

    Senha

</label>


<input
    type="password"
    id="senha"
    placeholder="Digite sua senha"
    autocomplete="current-password"
    required
>

</div>



<button
    type="submit"
    class="botao"
    id="botaoEntrar"
>

    🔐 Entrar

</button>


</form>



<div
    class="carregando"
    id="carregando"
>

    Verificando acesso...

</div>


</div>



<script type="module">


import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDtFVa120k4xnggOHibWOs61Jn-hJaSsdU",

    authDomain:
        "timonha-b36d6.firebaseapp.com",

    projectId:
        "timonha-b36d6",

    storageBucket:
        "timonha-b36d6.firebasestorage.app",

    messagingSenderId:
        "59864953764",

    appId:
        "1:59864953764:web:9d44c30ff09b00a0f44731"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);



/* =========================================
   ELEMENTOS
========================================= */

const form =
    document.getElementById(
        "formLogin"
    );


const email =
    document.getElementById(
        "email"
    );


const senha =
    document.getElementById(
        "senha"
    );


const botao =
    document.getElementById(
        "botaoEntrar"
    );


const mensagem =
    document.getElementById(
        "mensagem"
    );


const carregando =
    document.getElementById(
        "carregando"
    );



/* =========================================
   MENSAGEM
========================================= */

function mostrarMensagem(
    texto,
    tipo
) {

    mensagem.textContent =
        texto;

    mensagem.className =
        "mensagem " +
        tipo;

}



/* =========================================
   VERIFICAR SE JÁ ESTÁ LOGADO
========================================= */

onAuthStateChanged(

    auth,

    usuario => {

        if (usuario) {

            window.location.href =
                "admin.html";

        }

    }

);



/* =========================================
   LOGIN
========================================= */

form.addEventListener(

    "submit",

    async evento => {

        evento.preventDefault();


        const emailValor =
            email.value.trim();


        const senhaValor =
            senha.value;


        if (
            !emailValor ||
            !senhaValor
        ) {

            mostrarMensagem(
                "Preencha o e-mail e a senha.",
                "erro"
            );

            return;

        }


        botao.disabled =
            true;

        botao.textContent =
            "Entrando...";


        carregando.style.display =
            "block";


        mensagem.className =
            "mensagem";


        try {

            await signInWithEmailAndPassword(

                auth,

                emailValor,

                senhaValor

            );


            mostrarMensagem(
                "Login realizado com sucesso!",
                "sucesso"
            );


            setTimeout(

                () => {

                    window.location.href =
                        "admin.html";

                },

                500

            );

        }


        catch(erro) {

            console.error(
                erro
            );


            let texto =
                "Não foi possível entrar.";


            if (
                erro.code ===
                "auth/invalid-credential"
            ) {

                texto =
                    "E-mail ou senha incorretos.";

            }


            else if (
                erro.code ===
                "auth/user-not-found"
            ) {

                texto =
                    "Usuário não encontrado.";

            }


            else if (
                erro.code ===
                "auth/wrong-password"
            ) {

                texto =
                    "Senha incorreta.";

            }


            else if (
                erro.code ===
                "auth/invalid-email"
            ) {

                texto =
                    "E-mail inválido.";

            }


            else if (
                erro.code ===
                "auth/too-many-requests"
            ) {

                texto =
                    "Muitas tentativas. Aguarde alguns minutos.";

            }


            mostrarMensagem(
                texto,
                "erro"
            );


            botao.disabled =
                false;

            botao.textContent =
                "🔐 Entrar";

            carregando.style.display =
                "none";

        }

    }

);

</script>


</body>

</html>
```
